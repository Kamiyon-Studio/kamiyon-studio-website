# Deploy OpenNext Worker to Cloudflare.
#
# Credentials live on GitHub *Environments*, not on the repository, so a run can
# only read the Cloudflare token for the environment it was approved for:
#   staging     — auto-deploys, restricted to the `staging` branch
#   Production  — requires a manual reviewer approval, restricted to `main`
#
# Per-environment secrets (both environments):
#   CLOUDFLARE_API_TOKEN  — scoped token: Workers Scripts Edit, Workers R2
#                           Storage Edit, Account Settings Read (this account only)
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Repository variables supply build-time Next.js config (see
# context/deploy-runbook.md). `NEXT_PUBLIC_*` is inlined at build time and
# robots.txt/sitemap.xml are prerendered, so each has a literal default: an unset
# repo variable would otherwise bake `http://localhost:3000` and ship
# `Disallow: /` to production.
#
# Triggers:
#   push → staging branch → pnpm deploy:staging (wrangler --env staging)
#   push → main branch    → pnpm deploy:prod    (production, after approval)
#
# Track A owns package scripts:
#   deploy:staging / deploy:prod = opennextjs-cloudflare build + deploy
#
# Actions are pinned to commit SHAs; a moving tag could otherwise be repointed at
# attacker-controlled code that reads these secrets.

name: Deploy

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target (manual override)
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cloudflare-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy (staging)
    if: >-
      (github.event_name == 'push' && github.ref_name == 'staging') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Keep the job's GITHUB_TOKEN out of .git/config so a compromised
          # dependency's install script cannot reuse it to push.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        run: pnpm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ENV: ${{ vars.APP_ENV_STAGING || 'staging' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL_STAGING || 'https://kamiyon-studio-website-staging.limosnerosherwin.workers.dev' }}
          NEXT_PUBLIC_R2_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_R2_PUBLIC_BASE_URL_STAGING || 'https://media-staging.kamiyonstudio.com' }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || 'c6ej1xoj' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'kamiyon' }}
          NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN_STAGING }}

  deploy-production:
    name: Deploy (production)
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        run: pnpm run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ENV: ${{ vars.APP_ENV_PRODUCTION || 'production' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL_PRODUCTION || 'https://kamiyonstudio.com' }}
          NEXT_PUBLIC_R2_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_R2_PUBLIC_BASE_URL_PRODUCTION || 'https://media.kamiyonstudio.com' }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || 'c6ej1xoj' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'kamiyon' }}
          NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN_PRODUCTION }}
